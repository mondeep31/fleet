services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data

  traefik:
    image: traefik:v3.6.2
    container_name: fleet-traefik
    ports:
      - "127.0.0.1:${TRAEFIK_WEB_HOST_PORT:-18080}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_HOST_PORT:-18081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${FLEET_TRAEFIK_DYNAMIC_DIR:-/tmp/fleet-traefik-dynamic}:/dynamic:ro
    networks:
      - fleet-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=fleet-proxy"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"

networks:
  fleet-proxy:
    name: fleet-proxy

volumes:
  redis_data:
