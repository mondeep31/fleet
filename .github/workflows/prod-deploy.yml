## push
name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: self-hosted
    environment: production

    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"

          git fetch origin main
          git reset --hard origin/main

          if [ ! -f ../app_env/.env ]; then
            echo "Missing app_env/.env — create it on the server before deploying." >&2
            exit 1
          fi

          cp ../app_env/.env .env
          cp ../app_env/.env apps/dashboard/.env.production

          # app_env may carry development defaults; force production on the host
          sed -i 's/^NODE_ENV=.*/NODE_ENV=production/' .env
          sed -i 's/^NODE_ENV=.*/NODE_ENV=production/' apps/dashboard/.env.production

          bun run install:all -- --frozen-lockfile
          bun run build:prod

          docker compose up -d

          pm2 startOrReload ecosystem.config.cjs --env production
          pm2 save
